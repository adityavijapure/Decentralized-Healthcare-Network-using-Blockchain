spring.application.name=backend

# 1. DATABASE CONNECTION
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-calm-queen-b4e3zwue-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_w2rs1zgdhMIY}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. SERVER CONFIGURATION
server.port=${SERVER_PORT:8085}

# 3. JPA / HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 4. MULTIPART / FILE UPLOAD (Crucial for Doctor Proof & Medical Records)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 5. SECURITY / CORS (Ensures Spring doesn't reject OPTIONS requests)
spring.main.allow-bean-definition-overriding=true

# Custom property to define where images are stored
file.upload-dir=${FILE_UPLOAD_DIR:./uploads/doctor_proofs}